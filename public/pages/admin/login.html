<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Cinema System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/auth.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .auth-container { border-top: 5px solid #ff4444; }
        .auth-header h1 { color: #ff4444; }
        .auth-btn { background: #ff4444; color: white; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1>ADMINISTRACIÓN</h1>
            <p>Acceso restringido para personal</p>
        </div>
        <form id="adminLoginForm">
            <div class="form-group">
                <label for="email">Correo Administrativo</label>
                <input type="email" id="email" placeholder="admin@cine.com" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="auth-btn">ACCEDER AL PANEL</button>
        </form>
        <div class="auth-footer">
            <a href="/pages/login.html">Volver al portal de usuarios</a>
        </div>
    </div>

    <script type="module">
        import { login } from '/js/auth.js';
        
        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const result = await login(email, password);
            
            if (result.success && result.user.rol === 'admin') {
                Swal.fire({
                    title: 'Acceso Autorizado',
                    text: 'Bienvenido al panel de control',
                    icon: 'success',
                    timer: 1500,
                    showConfirmButton: false
                }).then(() => {
                    window.location.href = '/pages/index.html';
                });
            } else {
                const msg = !result.success ? result.message : "No tienes permisos de administrador";
                Swal.fire({
                    title: 'Acceso Denegado',
                    text: msg,
                    icon: 'error',
                    confirmButtonColor: '#ff4444'
                });
            }
        });
    </script>
</body>
</html>
