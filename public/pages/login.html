<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Cinema Premium</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/auth.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <video autoplay muted loop class="bg-video">
        <source src="https://assets.mixkit.co/videos/preview/mixkit-cinematic-view-of-a-movie-theater-with-empty-seats-41122-large.mp4" type="video/mp4">
    </video>

    <div class="auth-container">
        <div class="auth-header">
            <h1>Bienvenido</h1>
            <p>Ingresa tus credenciales para continuar</p>
        </div>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" placeholder="ejemplo@cine.com" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="auth-btn">INGRESAR</button>
        </form>
        <div class="auth-footer">
            ¿No tienes cuenta? <a href="/pages/registro.html">Regístrate aquí</a>
        </div>
        <div class="auth-footer" style="margin-top: 10px; font-size: 0.8rem;">
            <a href="/pages/admin/login.html" style="color: #666;">Acceso Administrador</a>
        </div>
    </div>

    <script type="module">
        import { login } from '/js/auth.js';
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const result = await login(email, password);
            
            if (result.success) {
                Swal.fire({
                    title: '¡Bienvenido!',
                    text: `Hola, ${result.user.nombre}`,
                    icon: 'success',
                    timer: 2000,
                    showConfirmButton: false
                }).then(() => {
                    if (result.user.rol === 'admin') {
                        window.location.href = '/pages/index.html'; // Admin Dashboard
                    } else {
                        window.location.href = '/pages/Cartelera.html';
                    }
                });
            } else {
                Swal.fire({
                    title: 'Error',
                    text: result.message,
                    icon: 'error',
                    confirmButtonColor: '#d4af37'
                });
            }
        });
    </script>
</body>
</html>
