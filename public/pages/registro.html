<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Cinema Premium</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/auth.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <video autoplay muted loop class="bg-video">
        <source src="https://assets.mixkit.co/videos/preview/mixkit-cinematic-view-of-a-movie-theater-with-empty-seats-41122-large.mp4" type="video/mp4">
    </video>

    <div class="auth-container">
        <div class="auth-header">
            <h1>Crea tu cuenta</h1>
            <p>Únete a la mejor experiencia cinematográfica</p>
        </div>
        <form id="registerForm">
            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" placeholder="Tu nombre" required>
            </div>
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" placeholder="ejemplo@cine.com" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="auth-btn">REGISTRARME</button>
        </form>
        <div class="auth-footer">
            ¿Ya tienes cuenta? <a href="/pages/login.html">Inicia sesión aquí</a>
        </div>
    </div>

    <script type="module">
        import { register } from '/js/auth.js';
        
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const userData = {
                nombre: document.getElementById('nombre').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                apellido: "", // Placeholder
                rol: "usuario"
            };
            
            const result = await register(userData);
            
            if (result.success) {
                Swal.fire({
                    title: '¡Registro Exitoso!',
                    text: 'Ahora puedes iniciar sesión',
                    icon: 'success',
                    confirmButtonColor: '#d4af37'
                }).then(() => {
                    window.location.href = '/pages/login.html';
                });
            } else {
                Swal.fire({
                    title: 'Error',
                    text: result.message,
                    icon: 'error',
                    confirmButtonColor: '#d4af37'
                });
            }
        });
    </script>
</body>
</html>
